name: Récupérer les métadonnées YouTube

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Écraser aussi les champs déjà remplis"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer titres et chaînes (oEmbed)
        env:
          # Optionnel : ajouter un secret YOUTUBE_API_KEY pour récupérer aussi
          # les durées (oEmbed ne les expose pas).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-metadata.mjs ${{ inputs.force && '--force' || '' }}

      - name: Associer les fiches éditoriales
        run: node scripts/import-fiches.mjs ${{ inputs.force && '--force' || '' }}

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Mise à jour automatique des métadonnées vidéo"
            git push
          fi
