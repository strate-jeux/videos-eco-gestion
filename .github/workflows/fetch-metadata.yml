name: Récupérer titres et durées YouTube

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-télécharger aussi les vidéos déjà renseignées"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Lancer le script de récupération
        run: node scripts/fetch-metadata.mjs ${{ inputs.force && '--force' || '' }}

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Mise à jour automatique des titres et durées YouTube"
            git push
          fi
